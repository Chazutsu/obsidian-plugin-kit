version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 3
