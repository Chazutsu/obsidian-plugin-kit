name: Bug report
description: Report a reproducible defect in obsidian-plugin-kit
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Remove vault data and secrets from reproductions.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I reproduced the issue in a minimal fixture.
          required: true
  - type: input
    id: version
    attributes:
      label: obsidian-plugin-kit version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Node.js and pnpm versions, and relevant bundler version.
      placeholder: macOS 15, Node.js 24, pnpm 10.7.0, Rolldown 1.0.0-rc.5
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a repository, fixture, or precise commands using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
