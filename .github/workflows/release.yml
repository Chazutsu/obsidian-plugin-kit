name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match package version '+p.version); }"
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm verify:package
      - run: pnpm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tgz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
